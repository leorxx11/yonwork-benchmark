name: yonwork-benchmark

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BENCH_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 ./scripts/bootstrap.sh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-benchmark}
      MYSQL_USER: ${MYSQL_USER:-bench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 ./scripts/bootstrap.sh}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./infra/data:/var/lib/mysql
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  new-api:
    # 当前已验证版本 v1.0.0-rc.38；固定摘要，避免换机时 latest 静默变化。
    image: calciumion/new-api@sha256:0a4d62b1b2b796a43a5e0ef92d49f12e0f229ab206b8f5a3a4cd42990121bfe1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEWAPI_PORT:-3000}:3000"
    volumes:
      - ./newapi/data:/data
      - ./newapi/logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET:?请先运行 ./scripts/bootstrap.sh}
      # v1.0.0-rc.38 实际读取 RELAY_*；无前缀的旧变量不会生效。
      # DeepSeek 渠道另设 setting.http_protocol=http1，见 docs/newapi-stall.md。
      RELAY_IDLE_CONN_TIMEOUT: ${NEWAPI_IDLE_CONN_TIMEOUT:-30}
      RELAY_MAX_IDLE_CONNS: ${NEWAPI_MAX_IDLE_CONNS:-8}
      # HTTP/1.1 下负值禁止空闲连接回池，绕过本机复用连接间歇性卡住的问题。
      RELAY_MAX_IDLE_CONNS_PER_HOST: ${NEWAPI_MAX_IDLE_CONNS_PER_HOST:--1}
      RELAY_RESPONSE_HEADER_TIMEOUT: ${NEWAPI_RESPONSE_HEADER_TIMEOUT:-60}
      RELAY_TIMEOUT: ${NEWAPI_RELAY_TIMEOUT:-180}
      STREAMING_TIMEOUT: ${NEWAPI_STREAMING_TIMEOUT:-180}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: yonwork-benchmark:local
    build:
      context: .
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    init: true
    # WSL 原生 Docker 使用 host 网络后，容器里的 127.0.0.1 与 WSL 共用；
    # mirrored 网络再把它连到 Windows loopback。这样 YonWork 可以安全地只绑 127.0.0.1。
    network_mode: host
    command: ["python", "-m", "uvicorn", "web.api:app", "--host", "127.0.0.1", "--port", "${BENCH_WEB_PORT:-8000}"]
    environment: &benchmark-environment
      BENCH_DB_HOST: 127.0.0.1
      BENCH_DB_PORT: ${BENCH_DB_PORT:-3307}
      BENCH_DB_NAME: ${MYSQL_DATABASE:-benchmark}
      BENCH_DB_USER: ${MYSQL_USER:-bench}
      BENCH_DB_PASSWORD: ${MYSQL_PASSWORD}
      BENCH_CASE_CATALOG: cases/catalog.yaml
      YONWORK_RUNTIME_FILE: /yonwork-data/host-api-runtime.json
      YONWORK_RUNTIME_HOST: 127.0.0.1
      YONWORK_XIYOUJI_PATH: ${YONWORK_XIYOUJI_PATH:-}
      NEWAPI_BASE_URL: http://127.0.0.1:${NEWAPI_PORT:-3000}
      NEWAPI_USER_ID: ${NEWAPI_USER_ID:-1}
      NEWAPI_ACCESS_TOKEN: ${NEWAPI_ACCESS_TOKEN:-}
      NEWAPI_TOKEN_NAME: ${NEWAPI_TOKEN_NAME:-}
      # 采集代理跟着 Worker 进程内起，不是单独的服务：独立服务一旦挂了，
      # 产品的模型调用会全部失败，等于我们把被测对象弄坏了。
      # 容器是 network_mode: host，绑 127.0.0.1 就是 WSL 的 loopback，
      # 再由 mirrored 网络连到 Windows——和 YonWork 只绑 127.0.0.1 是同一个机制。
      BENCH_COLLECTOR_ENABLED: ${BENCH_COLLECTOR_ENABLED:-0}
      BENCH_COLLECTOR_BIND: ${BENCH_COLLECTOR_BIND:-127.0.0.1}
      BENCH_COLLECTOR_PORT: ${BENCH_COLLECTOR_PORT:-3312}
      BENCH_COLLECTOR_UPSTREAM: ${BENCH_COLLECTOR_UPSTREAM:-}
      BENCH_COLLECTOR_UPSTREAM_KEY: ${BENCH_COLLECTOR_UPSTREAM_KEY:-}
      BENCH_COLLECTOR_CLIENT_TOKEN: ${BENCH_COLLECTOR_CLIENT_TOKEN:-}
      BENCH_COLLECTOR_LEDGER_DIR: ${BENCH_COLLECTOR_LEDGER_DIR:-results}
      BENCH_COLLECTOR_TIMEOUT_SECONDS: ${BENCH_COLLECTOR_TIMEOUT_SECONDS:-300}
      NO_PROXY: "*"
      no_proxy: "*"
    volumes: &benchmark-volumes
      - ./results:/app/results
      - ./cases:/app/cases:ro
      - type: bind
        source: ${YONWORK_DATA_DIR:?请先运行 ./scripts/bootstrap.sh}
        target: /yonwork-data
        read_only: true
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BENCH_WEB_PORT:-8000}/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  collector:
    # 逐请求模型调用采集入口。**常驻**，不跟着跑批起停——
    # 跟着起停的话，不跑批时产品里那个模型是死的，手动一用就报
    # 「模型服务暂时不可用」，而且那个报错看起来像产品坏了（2026-09-22 踩过）。
    # 跑批通过 /_control 注册轮次，见 runner/modelproxy/client.py。
    image: yonwork-benchmark:local
    command: ["python", "-m", "runner.modelproxy", "serve", "--batch-id", "collector-idle"]
    restart: unless-stopped
    init: true
    # 绑 127.0.0.1 就是 WSL 的 loopback，再由 mirrored 网络连到 Windows，
    # 所以 YonWork / WorkBuddy 填 http://127.0.0.1:3312/v1 就能连上。
    network_mode: host
    environment: *benchmark-environment
    volumes:
      - ./results:/app/results
      - ./cases:/app/cases:ro
      # 源码挂进来而不是烤进镜像：这一层还在迭代，挂载之后
      # `docker compose restart collector` 就能生效，不用重建镜像。
      # （也绕开了本机拉不到 Docker Hub / PyPI 时根本建不了镜像的问题。）
      - ./runner:/app/runner:ro
      - type: bind
        source: ${YONWORK_DATA_DIR:?请先运行 ./scripts/bootstrap.sh}
        target: /yonwork-data
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-m", "runner.modelproxy", "health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    # 与 Web 共用同一镜像，避免首次启动时并行构建两份完全相同的层。
    image: yonwork-benchmark:local
    command: ["python", "-m", "runner.worker"]
    restart: unless-stopped
    init: true
    # 收到 compose stop 后不再开下一轮，并给当前轮足够时间写完 JSONL。
    stop_grace_period: 11m
    network_mode: host
    environment: *benchmark-environment
    volumes: *benchmark-volumes
    depends_on:
      mysql:
        condition: service_healthy
      new-api:
        condition: service_healthy
    # 采集代理关着时恒为健康（关着是默认状态，不是故障）；
    # 开着但入口连不上才会变 unhealthy——那正是「配了却没生效」的信号。
    healthcheck:
      test: ["CMD", "python", "-m", "runner.modelproxy", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
