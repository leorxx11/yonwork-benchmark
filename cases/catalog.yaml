version: 1

case_sets:
  - id: smoke
    name: 基础冒烟
    description: 验证普通问答与工具调用链路是否可用。
    cases:
      - id: Case01
        prompt: 查看今天北京天气怎么样？
        runs: 2
        enabled: false
        assertions:
          min_length: 1

      - id: Case02
        prompt: 你好！
        runs: 1
        enabled: true
        assertions:
          min_length: 1

  - id: tools
    name: 工具调用
    description: >-
      验证「模型真的调了工具」，不是「答案看起来像调过工具」。
      **`min_tool_calls` 是这组用例的重点**：不声明的话，模型一次工具都不调、
      直接凭记忆编一个答案，五层断言照样全绿——探针 S5/S6 就是这么
      把两个普通短文本场景当成「工具场景没问题」的证据的（CLAUDE.md 七-2.5）。
      ⚠️ 跑 WorkBuddy 时必须开「允许调用工具」，否则驱动传 `--tools ''`，
      这一组会判 Invalid（跑法不对，不是产品的错）而不是 Fail。
    cases:
      # 刻意选一个**不能靠记忆回答**的问题：当前目录的内容只有真的去看才知道。
      # 「北京天气」那种题模型可以编一个像样的答案，断言分不出真假。
      - id: Case01
        prompt: >-
          列出当前工作目录下的文件和子目录，然后告诉我一共有多少项。
          必须实际查看目录，不要凭猜测回答；如果无法访问文件系统，请直接说明。
        runs: 2
        enabled: true
        assertions:
          min_tool_calls: 1
          min_length: 10

  - id: long-text
    name: 长文本文件检索
    description: 读取本地《西游记》并验证长文本检索；文件的 Windows 路径由环境变量提供。
    cases:
      - id: Case01
        prompt: >-
          打开本地文件 ${YONWORK_XIYOUJI_PATH}，仅依据该文件内容完成任务，不要使用网络搜索，
          也不要凭已有的《西游记》知识直接回答。请在全文中搜索“凤仙郡”，并回答：
          1）“凤仙郡”在全文中一共出现多少次；
          2）首次出现和最后一次出现分别位于哪一回，请给出完整回目标题；
          3）分别摘录首次出现和最后一次出现所在的完整自然段；
          4）根据文件内容，用不超过 100 字概括凤仙郡相关情节。
          最后按“出现次数 / 首次出现 / 最后出现 / 情节概括”四个部分输出。
          如果无法读取该本地文件，请明确说明失败原因，不要猜测答案。
        runs: 3
        enabled: true
        assertions:
          expect:
            - 凤仙郡
          forbid:
            - 无法读取
          min_length: 100

  - id: client-probe
    name: 客户端体验探针场景
    description: >-
      给 runner.client_probe 用，不进主跑批。测的是「Agent 数据到达客户端之后，
      YonWork 呈现不同复杂度内容是否引入可感知延迟」。
      **输出长度必须受控**——测的是渲染 X 字节的成本，X 每轮不一样就没法比，
      所以这里全用「恰好 N 行」这类确定性指令，并在结果里记录实际字符数做归一化。
    cases:
      - id: S1
        prompt: 请用三句话介绍一下杭州，不要用列表，不要用 Markdown 格式。
        runs: 3
        assertions:
          min_length: 30

      - id: S2
        prompt: >-
          输出一个 Markdown 表格，恰好 60 行数据（不含表头）。
          表头为：序号 | 名称 | 分类 | 说明。
          序号从 1 递增到 60，名称用「条目N」，分类在 A/B/C 三者间循环，
          说明固定写「这是用于渲染压力测试的占位说明文本」。
          只输出表格本身，前后不要任何多余文字。
        runs: 3
        assertions:
          expect: ["条目60"]
          min_length: 2000

      - id: S3
        prompt: >-
          输出一个 Markdown 表格，恰好 250 行数据（不含表头）。
          表头为：序号 | 名称 | 分类 | 说明。
          序号从 1 递增到 250，名称用「条目N」，分类在 A/B/C 三者间循环，
          说明固定写「这是用于渲染压力测试的占位说明文本」。
          只输出表格本身，前后不要任何多余文字。
        runs: 3
        assertions:
          expect: ["条目250"]
          min_length: 8000

      - id: S4
        prompt: >-
          依次输出三部分，每部分之间空一行，不要任何解释文字：
          第一部分：一个恰好 30 行数据的 Markdown 表格，表头为 序号 | 键 | 值。
          第二部分：一个 python 代码块，包含恰好 40 行代码，内容为打印 1 到 40 的循环展开写法。
          第三部分：一个恰好 20 项的嵌套无序列表，每项下再带 2 个子项。
        runs: 3
        assertions:
          min_length: 1500

      # S5 / S6 是**不受控**场景：输出长度和结构取决于模型当轮行为，
      # 所以只看 Long Task 和 text_updates，不参与归一化比较。
      # 见 docs/client-probe-protocol.md。探针会记录 tool_calls，
      # 如果实际没触发工具，这两个场景就没有测到它们该测的东西——照实报。
      - id: S5
        prompt: >-
          请依次完成三件事，每件事单独一段，不要合并：
          第一，列出当前工作目录下的文件；
          第二，告诉我现在的日期和时间；
          第三，用一句话总结你刚才做了什么。
        runs: 3
        assertions:
          min_length: 50

      - id: S6
        prompt: >-
          请生成一份名为 probe-artifact 的 Markdown 文档并保存为文件，
          内容是一个恰好 20 行数据的表格，表头为 序号 | 指标 | 数值。
          保存完成后用一句话告诉我文件路径。
        runs: 3
        assertions:
          min_length: 20

      # S7 和 S1 的 prompt **必须完全一致**——变量只有「会话里已有多少历史」。
      # 执行方式也不同：它走 auto=False，发到预先养出长历史的那个会话。
      - id: S7
        prompt: 请用三句话介绍一下杭州，不要用列表，不要用 Markdown 格式。
        runs: 3
        assertions:
          min_length: 30
