version: 1

case_sets:
  - id: smoke
    name: 基础冒烟
    description: 验证普通问答与工具调用链路是否可用。
    cases:
      - id: Case01
        prompt: 查看今天北京天气怎么样？
        runs: 2
        enabled: false
        assertions:
          min_length: 1

      - id: Case02
        prompt: 你好！
        runs: 1
        enabled: true
        assertions:
          min_length: 1

  - id: tools
    name: 工具调用
    description: >-
      验证「模型真的调了工具」，不是「答案看起来像调过工具」。
      **`min_tool_calls` 是这组用例的重点**：不声明的话，模型一次工具都不调、
      直接凭记忆编一个答案，五层断言照样全绿——探针 S5/S6 就是这么
      把两个普通短文本场景当成「工具场景没问题」的证据的（CLAUDE.md 七-2.5）。
      ⚠️ 跑 WorkBuddy 时必须开「允许调用工具」，否则驱动传 `--tools ''`，
      这一组会判 Invalid（跑法不对，不是产品的错）而不是 Fail。
    cases:
      # 刻意选一个**不能靠记忆回答**的问题：当前目录的内容只有真的去看才知道。
      # 「北京天气」那种题模型可以编一个像样的答案，断言分不出真假。
      - id: Case01
        prompt: >-
          列出当前工作目录下的文件和子目录，然后告诉我一共有多少项。
          必须实际查看目录，不要凭猜测回答；如果无法访问文件系统，请直接说明。
        runs: 2
        enabled: true
        assertions:
          min_tool_calls: 1
          min_length: 10

  - id: long-text
    name: 长文本文件检索
    description: 读取本地《西游记》并验证长文本检索；文件的 Windows 路径由环境变量提供。
    cases:
      - id: Case01
        prompt: >-
          打开本地文件 ${YONWORK_XIYOUJI_PATH}，仅依据该文件内容完成任务，不要使用网络搜索，
          也不要凭已有的《西游记》知识直接回答。请在全文中搜索“凤仙郡”，并回答：
          1）“凤仙郡”在全文中一共出现多少次；
          2）首次出现和最后一次出现分别位于哪一回，请给出完整回目标题；
          3）分别摘录首次出现和最后一次出现所在的完整自然段；
          4）根据文件内容，用不超过 100 字概括凤仙郡相关情节。
          最后按“出现次数 / 首次出现 / 最后出现 / 情节概括”四个部分输出。
          如果无法读取该本地文件，请明确说明失败原因，不要猜测答案。
        runs: 3
        enabled: true
        assertions:
          expect:
            - 凤仙郡
          forbid:
            - 无法读取
          min_length: 100

  - id: four-way
    name: 四模式横向对比
    description: >-
      给「YonWork × WorkBuddy」乘「产品默认模型 × 我们的采集代理」这四个模式用。

      **只有两条代理路之间是干净对比**（同模型 deepseek-flash、同网关）。
      同一产品的「默认 vs 代理」模型和路径同时变了，差值不能归因给任何一方；
      两个「默认」是不同的模型（deepseek-v4-flash vs minimax-m3），
      那是「开箱配置对比」，不是模型对比。看报告前先记住这三句。

      设计上刻意避开三类会毁掉可比性的东西：
      **不碰文件系统**（WorkBuddy 的当前目录是 UNC 路径，两边问的不是同一个目录，
      见七-3.5）、**不联网**（结果不可复现）、**不用工具**（工具是另一条轴，
      而且 WorkBuddy 开工具会连带 `bypassPermissions`）。

      输出长度**受控**：用「恰好 N 行」「原样重复 N 遍」这类确定性指令，
      而不是「写 500 字」——模型数不准字数，长度每轮不一样就没法比输出 token 和耗时。

      ⚠️ **不声明 `max_input_tokens` 和 `max_seconds`**，只记录不判定。
      一个常数跨不了两个产品：同样一句话 YonWork 实测约 16k input、
      WorkBuddy 约 3.7k，差 4 倍多；WorkBuddy 还每轮起一个新进程。
      规矩见七-0.2——**样本够了再定阈值，别先拍一个数**。
    cases:
      # C1 基线：最短的受控文本。用来看四个模式的「地板」在哪。
      - id: C1
        prompt: >-
          请用恰好三句话介绍杭州这座城市。不要使用列表，不要使用 Markdown 格式，
          不要加开场白和总结，直接输出这三句话。
        runs: 3
        assertions:
          min_length: 30
          forbid:
            - 抱歉
            - 无法完成

      # C2 结构化输出：行数确定，输出 token 可比，同时压一压格式遵循。
      - id: C2
        prompt: >-
          输出一个 Markdown 表格，恰好 40 行数据（不含表头）。
          表头为：序号 | 名称 | 分类。
          序号从 1 递增到 40，名称写「条目N」（N 为序号），分类在 A/B/C 三者间循环。
          只输出表格本身，前后不要任何多余文字。
        runs: 3
        assertions:
          expect:
            - 条目40
          min_length: 600

      # C3 指令遵循：严格 JSON。禁止代码块标记是重点——
      # 很多模型会习惯性包一层 ```json，那就是没按要求来。
      - id: C3
        prompt: >-
          只输出一个 JSON 对象，不要代码块标记，不要任何解释文字。
          对象包含三个字段：city 固定为字符串 "hangzhou"；
          items 是长度恰好 5 的字符串数组；count 是整数，等于 items 的长度。
        runs: 3
        assertions:
          json_parsable: true
          min_length: 20
          expect:
            - hangzhou
          forbid:
            - "```"

      # C4 输出规模：原样重复比「写 N 字」确定得多，模型数不准字数。
      # 这一条是看输出 token 和耗时随输出长度怎么变的主力。
      #
      # ⚠️ min_length 必须**算出来**，不能拍脑袋。
      # 正确答案恰好是 8 字 × 30 行 + 29 个换行 = 269。
      # 2026-09-22 第一次跑把它写成 400，结果四个模式全判 Fail——
      # 而四个模式其实都完美答对了（30 行、每行都对）。
      # 那是拿我们自己的配置错误去算产品的失败率（二-4），比漏判更糟。
      # 260 留一点余量容忍末尾换行差异，同时仍能抓住「少于 29 行」的截断。
      - id: C4
        prompt: >-
          请把下面这一行原样重复 30 遍，每遍单独一行，不要编号，
          不要任何其它文字：
          基准测试用占位行
        runs: 3
        assertions:
          expect:
            - 基准测试用占位行
          min_length: 260

  - id: client-probe
    name: 客户端体验探针场景
    description: >-
      给 runner.client_probe 用，不进主跑批。测的是「Agent 数据到达客户端之后，
      YonWork 呈现不同复杂度内容是否引入可感知延迟」。
      **输出长度必须受控**——测的是渲染 X 字节的成本，X 每轮不一样就没法比，
      所以这里全用「恰好 N 行」这类确定性指令，并在结果里记录实际字符数做归一化。
    cases:
      - id: S1
        prompt: 请用三句话介绍一下杭州，不要用列表，不要用 Markdown 格式。
        runs: 3
        assertions:
          min_length: 30

      - id: S2
        prompt: >-
          输出一个 Markdown 表格，恰好 60 行数据（不含表头）。
          表头为：序号 | 名称 | 分类 | 说明。
          序号从 1 递增到 60，名称用「条目N」，分类在 A/B/C 三者间循环，
          说明固定写「这是用于渲染压力测试的占位说明文本」。
          只输出表格本身，前后不要任何多余文字。
        runs: 3
        assertions:
          expect: ["条目60"]
          min_length: 2000

      - id: S3
        prompt: >-
          输出一个 Markdown 表格，恰好 250 行数据（不含表头）。
          表头为：序号 | 名称 | 分类 | 说明。
          序号从 1 递增到 250，名称用「条目N」，分类在 A/B/C 三者间循环，
          说明固定写「这是用于渲染压力测试的占位说明文本」。
          只输出表格本身，前后不要任何多余文字。
        runs: 3
        assertions:
          expect: ["条目250"]
          min_length: 8000

      - id: S4
        prompt: >-
          依次输出三部分，每部分之间空一行，不要任何解释文字：
          第一部分：一个恰好 30 行数据的 Markdown 表格，表头为 序号 | 键 | 值。
          第二部分：一个 python 代码块，包含恰好 40 行代码，内容为打印 1 到 40 的循环展开写法。
          第三部分：一个恰好 20 项的嵌套无序列表，每项下再带 2 个子项。
        runs: 3
        assertions:
          min_length: 1500

      # S5 / S6 是**不受控**场景：输出长度和结构取决于模型当轮行为，
      # 所以只看 Long Task 和 text_updates，不参与归一化比较。
      # 见 docs/client-probe-protocol.md。探针会记录 tool_calls，
      # 如果实际没触发工具，这两个场景就没有测到它们该测的东西——照实报。
      - id: S5
        prompt: >-
          请依次完成三件事，每件事单独一段，不要合并：
          第一，列出当前工作目录下的文件；
          第二，告诉我现在的日期和时间；
          第三，用一句话总结你刚才做了什么。
        runs: 3
        assertions:
          min_length: 50

      - id: S6
        prompt: >-
          请生成一份名为 probe-artifact 的 Markdown 文档并保存为文件，
          内容是一个恰好 20 行数据的表格，表头为 序号 | 指标 | 数值。
          保存完成后用一句话告诉我文件路径。
        runs: 3
        assertions:
          min_length: 20

      # S7 和 S1 的 prompt **必须完全一致**——变量只有「会话里已有多少历史」。
      # 执行方式也不同：它走 auto=False，发到预先养出长历史的那个会话。
      - id: S7
        prompt: 请用三句话介绍一下杭州，不要用列表，不要用 Markdown 格式。
        runs: 3
        assertions:
          min_length: 30
