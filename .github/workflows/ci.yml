name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install -r runner/requirements.txt

      - name: Test runner
        run: python -m unittest discover -s runner/tests -t .

      - name: Test web
        run: python -m unittest discover -s web/tests -t .

      - name: Test usage collector
        working-directory: yonwork_usage
        run: python -m unittest discover -s tests

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test trace bridge
        run: node --test plugins/benchmark-trace-bridge/
